    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #f4f7fb;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow-x: hidden;
        }

        /* Top Blurred Warm Header Background */
        .top-banner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 240px;
            background: linear-gradient(180deg, #d97706 0%, #f59e0b 40%, rgba(245, 158, 11, 0.2) 80%, rgba(244, 247, 251, 0) 100%);
            filter: blur(10px);
            z-index: 0;
            transform: scale(1.1);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 40px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Profile Photo Container */
        .profile-wrapper {
            position: relative;
            margin-top: 20px;
            margin-bottom: 16px;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #f59e0b;
            box-shadow: 0 8px 24px rgba(217, 119, 6, 0.3);
            background-color: #000;
        }

        .telegram-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: #28a7ea;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .telegram-badge svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
            margin-right: 2px;
        }

        /* Channel Title & Subtitle */
        .channel-title {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .channel-subtitle {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            font-weight: 500;
            max-width: 380px;
            margin-bottom: 24px;
        }

        /* White Card Box */
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Badges Row */
        .badges-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-green {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #dcfce7;
        }

        .badge-orange {
            background-color: #fff7ed;
            color: #c2410c;
            border: 1px solid #ffedd5;
        }

        .badge-yellow {
            background-color: #fefce8;
            color: #854d0e;
            border: 1px solid #fef9c3;
        }

        /* Golden Main Button */
        .cta-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border-radius: 18px;
            padding: 12px 14px;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.35);
            border: 2px solid #fde047;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 16px;
        }

        .cta-button:active {
            transform: scale(0.98);
        }

        .cta-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
            fill: #0f172a;
        }

        .btn-text {
            text-align: left;
        }

        .btn-title {
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.2;
        }

        .btn-sub {
            font-size: 12px;
            color: #451a03;
            font-weight: 600;
            margin-top: 2px;
        }

        .arrow-circle {
            width: 38px;
            height: 38px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .arrow-circle svg {
            width: 18px;
            height: 18px;
            fill: #d97706;
        }

        /* Step Indicators */
        .steps-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            color: #334155;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .step-num {
            width: 20px;
            height: 20px;
            background-color: #eab308;
            color: #0f172a;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
        }

        .status-text {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        .status-green {
            color: #16a34a;
            font-weight: 700;
        }

        /* Footer Links */
        .footer {
            margin-top: auto;
            padding: 20px;
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            line-height: 1.6;
        }

        .footer-ads {
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
        }

        .footer-ads a {
            color: #28a7ea;
            text-decoration: none;
            font-weight: 700;
        }

        .footer-ads a:hover {
            text-decoration: underline;
        }
